{% extends 'base.html' %}

{% block title %}
    Реєстрація - Школа "Знання"
{% endblock %}

{% block content %}
<div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-logo">
                    <i class="fas fa-graduation-cap"></i>
                    <h4 class="mb-0">Школа "Знання"</h4>
                </div>
                <h5 class="mb-0">Створення нового облікового запису</h5>
            </div>
            <div class="auth-body">
                <form id="registerForm" method="POST">
                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-floating">
                                <input type="text" class="form-control" id="Name" name="username" placeholder="Ім'я" required>
                                <label for="firstName">Ім'я</label>
                            </div>
                        </div>
                    </div>
                        <div class="form-floating">
                            <input type="email" class="form-control" id="email" name="email" placeholder="Email" required>
                            <label for="email">Email</label>
                        </div>
                        <div class="form-group mb-3">
                            <label for="category" class="form-label">Категорія</label>
                                <select class="form-select" id="category" name="category" required>
                                    <option value="" selected disabled>Оберіть категорію</option>
                                    <option value="parents">Батьки</option>
                                    <option value="students">Учні</option>
                                    <option value="graduates">Випускники</option>
                                </select>
                        </div>
                        <div class="form-floating position-relative">
                            <input type="password" class="form-control" id="password" name="password" placeholder="Пароль" required>
                            <label for="password">Пароль</label>
                        </div>                    
                        <div class="form-floating position-relative">
                            <input type="password" class="form-control" id="confirmPassword" name="confirm_password" placeholder="Підтвердження паролю" required>
                            <label for="confirmPassword">Підтвердження паролю</label>
                        </div>
                        <div class="form-check mb-4 mt-3">
                            <input class="form-check-input" type="checkbox" id="termsCheck" required>
                            <label class="form-check-label" for="termsCheck">
                                Я погоджуюсь з <a href="#" class="text-decoration-none">умовами використання</a> та <a href="#" class="text-decoration-none">політикою конфіденційності</a>
                            </label>
                        </div>
                            <button type="submit" class="btn btn-primary w-100 py-2">Зареєструватися</button>
                </form>
            </div>
                <div class="auth-footer">
                    <p class="mb-0">Вже маєте акаунт? <a href="{{ url_for('login') }}" class="text-decoration-none">Увійти</a></p>
                </div>
        </div>
    </div>
{% endblock %}
