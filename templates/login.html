{% extends 'base.html' %}

{% block title %}
    Вхід - Школа "Знання"
{% endblock %}

{% block content %}
<div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-logo">
                    <i class="fas fa-graduation-cap"></i>
                    <h4 class="mb-0">Школа "Знання"</h4>
                </div>
                <h5 class="mb-0">Вхід до особистого кабінету</h5>
            </div>
            <div class="auth-body">
                <form id="loginForm" method="POST">
                    <div class="form-floating">
                        <input type="email" class="form-control" id="email" name="email" placeholder="Email" required>
                        <label for="email">Email</label>
                    </div>
                    <div class="form-floating position-relative">
                        <input type="password" class="form-control" id="password" name="password" placeholder="Пароль" required>
                        <label for="password">Пароль</label>
                    </div>
                    <div class="d-flex justify-content-between mb-4">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="rememberMe">
                            <label class="form-check-label" for="rememberMe">
                                Запам'ятати мене
                            </label>
                        </div>
                        <a href="#" class="text-decoration-none">Забули пароль?</a>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2">Увійти</button>
                </form>
            </div>
            <div class="auth-footer">
                <p class="mb-0">Ще не зареєстровані? <a href="{{ url_for('register') }}" class="text-decoration-none">Створити акаунт</a></p>
            </div>
        </div>
    </div>
{% endblock %}
